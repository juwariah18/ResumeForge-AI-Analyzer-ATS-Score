{% extends "base.html" %}{% block title %}My Resumes{% endblock %}{% block content %}<div class="form-page"><span class="badge">Saved</span><h1>My Resumes</h1><div class="saved-list">{% for r in resumes %}<div class="saved-card"><div><h3>{{ r['title'] }}</h3><small>{{ r['template'].title() }} • {{ r['source'] }} • {{ r['updated_at'][:10] }}</small></div><div><a class="btn small outline" href="{{ url_for('edit_resume',resume_id=r['id']) }}">Edit</a><a class="btn small primary" href="{{ url_for('resume_result',resume_id=r['id']) }}">View</a></div></div>{% else %}<p>No saved resumes yet.</p>{% endfor %}</div></div>{% endblock %}
